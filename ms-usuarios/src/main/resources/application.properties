spring.application.name=ms-usuarios
server.port=8081


spring.datasource.url=jdbc:mysql://localhost:3306/bposeguros_usuarios?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


server.error.include-message=always


ms.notificaciones.url=http://localhost:8084


server.forward-headers-strategy=framework
app.avatares.carpeta=uploads/avatares
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
