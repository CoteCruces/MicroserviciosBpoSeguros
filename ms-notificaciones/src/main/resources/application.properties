spring.application.name=ms-notificaciones
server.port=8084

# Para que los mensajes de error (ResponseStatusException) lleguen a la app, igual que en los servicios del profe
server.error.include-message=always

# Gmail SMTP. Las credenciales vienen de variables de entorno, NUNCA escritas aquí.
# El ":" final es un valor por defecto vacío: permite que el proyecto arranque (y los tests pasen)
# aunque todavía no hayas definido las variables.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
