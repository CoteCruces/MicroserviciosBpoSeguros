spring.application.name=ms-siniestros-documentos
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/bposeguros_siniestros?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always


ms.usuarios.url=http://localhost:8081
ms.catalogos.url=http://localhost:8082


app.documentos.carpeta=uploads/documentos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.forward-headers-strategy=framework